<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알뜰폰 혜택 트래커</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e3e6ea; --accent:#1a73e8; --accent-ink:#fff;
    --code-bg:#f2f4f7; --ok:#0f9d58; --warn:#b06000; --bad:#d93025;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171a; --card:#1d2125; --ink:#e8eaed; --muted:#9aa0a6;
      --line:#2f343a; --accent:#8ab4f8; --accent-ink:#14171a;
      --code-bg:#111417; --ok:#81c995; --warn:#fdd663; --bad:#f28b82;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:grid; place-items:start center; padding:24px;
  }
  .card{
    width:100%; max-width:600px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  h1{margin:0 0 4px; font-size:20px; letter-spacing:-.01em}
  h2{margin:0 0 12px; font-size:15px; letter-spacing:-.01em}
  .sub{margin:0 0 24px; color:var(--muted); font-size:14px}
  button{
    font:inherit; border-radius:10px; border:1px solid var(--line);
    padding:11px 18px; cursor:pointer; background:var(--card); color:var(--ink);
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button:disabled{opacity:.5; cursor:default}
  .primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .between{justify-content:space-between}
  .sec{border-top:1px solid var(--line); margin-top:24px; padding-top:22px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
    background:var(--code-bg); border:1px solid var(--line); border-radius:7px;
    padding:2px 6px; word-break:break-all;
  }
  table{border-collapse:collapse; width:100%; font-size:14px; margin-top:4px}
  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.05em}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  .hide{display:none}
  .muted{color:var(--muted); font-size:13px}
  .ok{color:var(--ok); font-weight:600}
  .warn{color:var(--warn)}
  .bad{color:var(--bad)}
  .note{background:var(--code-bg); border:1px solid var(--line); border-radius:10px;
        padding:12px 14px; font-size:13.5px; margin:14px 0}
</style>
</head>
<body>
<main class="card">
  <h1>알뜰폰 혜택 트래커</h1>
  <p class="sub">회선별 혜택 확인과 해지 최적기 판단</p>

  <section id="signedOut" class="hide">
    <button class="primary" id="btnIn">Google로 로그인</button>
    <p class="muted" style="margin-top:14px">
      본인 계정만 접근할 수 있습니다. 다른 계정으로는 데이터가 보이지 않습니다.
    </p>
  </section>

  <section id="signedIn" class="hide">
    <div class="row between">
      <span class="muted" id="who"></span>
      <button id="btnOut">로그아웃</button>
    </div>

    <div class="sec">
      <h2>데이터 적재</h2>
      <div id="status" class="muted">확인 중…</div>

      <div class="row" style="margin-top:14px">
        <button class="primary" id="btnImport" disabled>데이터 가져오기</button>
        <button id="btnRefresh">현황 새로고침</button>
      </div>

      <div id="overwriteNote" class="note hide">
        이미 데이터가 있습니다. 다시 가져오면 <strong>같은 ID를 덮어씁니다</strong> —
        확인완료 표시나 직접 수정한 값이 JSON 기준으로 되돌아갑니다.
        그래도 진행하려면 버튼을 한 번 더 누르세요.
      </div>

      <div id="result" class="hide" style="margin-top:16px">
        <table>
          <thead><tr><th>항목</th><th class="num">기대</th><th class="num">실제</th><th></th></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <div class="sec">
      <p class="muted">UID <code id="uid"></code></p>
    </div>
  </section>

  <p id="err" class="bad" style="margin:14px 0 0"></p>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, writeBatch }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const app  = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

const show = (el, on) => el.classList.toggle("hide", !on);
const fail = (e) => { $("err").textContent = e?.message || String(e); console.error(e); };

let expected = null;   // JSON 기준 기대 건수
let armed = false;     // 덮어쓰기 2차 확인

/** 저장소의 JSON 원본 */
async function loadSource() {
  const res = await fetch("data/altteul_lines.json", { cache: "no-store" });
  if (!res.ok) throw new Error("JSON 로드 실패 (" + res.status + ")");
  return res.json();
}

/** Firestore 실제 건수 — 회선 수와 월 문서 총합 */
async function countStored() {
  const lines = await getDocs(collection(db, "lines"));
  let months = 0;
  for (const d of lines.docs) {
    months += (await getDocs(collection(db, "lines", d.id, "months"))).size;
  }
  return { lines: lines.size, months };
}

/** months 는 하위 컬렉션으로 분리해 기록 */
async function importAll(src) {
  const batch = writeBatch(db);
  for (const L of src) {
    const { months, ...meta } = L;
    batch.set(doc(db, "lines", L.id), meta);
    for (const m of months) batch.set(doc(db, "lines", L.id, "months", m.ym), m);
  }
  await batch.commit();
}

function renderResult(actual) {
  const rows = [
    ["회선", expected.lines,  actual.lines],
    ["월 기록", expected.months, actual.months],
  ];
  $("resultBody").innerHTML = rows.map(([k, e, a]) =>
    `<tr><td>${k}</td><td class="num">${e}</td><td class="num">${a}</td>
     <td class="${a === e ? "ok" : "bad"}">${a === e ? "일치" : "불일치"}</td></tr>`
  ).join("");
  show($("result"), true);
}

async function refresh() {
  $("err").textContent = "";
  $("btnRefresh").disabled = true;
  try {
    if (!expected) {
      const src = await loadSource();
      expected = { lines: src.length, months: src.reduce((n, L) => n + L.months.length, 0) };
    }
    const actual = await countStored();
    const empty = actual.lines === 0 && actual.months === 0;
    armed = false;
    show($("overwriteNote"), false);
    $("btnImport").disabled = false;
    $("btnImport").textContent = empty ? "데이터 가져오기" : "다시 가져오기";
    $("status").innerHTML = empty
      ? `Firestore가 비어 있습니다. JSON에는 회선 <strong>${expected.lines}</strong>개,
         월 기록 <strong>${expected.months}</strong>건이 있습니다.`
      : `현재 회선 <strong>${actual.lines}</strong>개, 월 기록 <strong>${actual.months}</strong>건이 저장돼 있습니다.`;
    if (!empty) renderResult(actual);
  } catch (e) { fail(e); $("status").textContent = "현황을 읽지 못했습니다."; }
  $("btnRefresh").disabled = false;
}

async function runImport() {
  $("err").textContent = "";
  try {
    const actual = await countStored();
    if ((actual.lines || actual.months) && !armed) {
      armed = true;
      show($("overwriteNote"), true);
      $("btnImport").textContent = "덮어쓰기 진행";
      return;
    }
    $("btnImport").disabled = true;
    $("status").textContent = "기록 중…";
    await importAll(await loadSource());
    const after = await countStored();
    renderResult(after);
    const good = after.lines === expected.lines && after.months === expected.months;
    $("status").innerHTML = good
      ? `<span class="ok">적재 완료</span> — 기대 건수와 일치합니다.`
      : `<span class="bad">건수가 맞지 않습니다.</span> 아래 표를 확인하세요.`;
    armed = false;
    show($("overwriteNote"), false);
    $("btnImport").textContent = "다시 가져오기";
  } catch (e) { fail(e); $("status").textContent = "적재에 실패했습니다."; }
  $("btnImport").disabled = false;
}

onAuthStateChanged(auth, (user) => {
  $("err").textContent = "";
  show($("signedIn"), !!user);
  show($("signedOut"), !user);
  if (!user) return;
  $("who").textContent = user.email || "";
  $("uid").textContent = user.uid;
  refresh();
});

$("btnIn").onclick      = () => signInWithPopup(auth, provider).catch(fail);
$("btnOut").onclick     = () => signOut(auth).catch(fail);
$("btnRefresh").onclick = refresh;
$("btnImport").onclick  = runImport;
</script>
</body>
</html>
