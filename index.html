<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알뜰폰 혜택 트래커</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e3e6ea; --accent:#1a73e8; --accent-ink:#fff;
    --code-bg:#f2f4f7; --ok:#0f9d58;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171a; --card:#1d2125; --ink:#e8eaed; --muted:#9aa0a6;
      --line:#2f343a; --accent:#8ab4f8; --accent-ink:#14171a;
      --code-bg:#111417; --ok:#81c995;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:grid; place-items:center; padding:24px;
  }
  .card{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  h1{margin:0 0 4px; font-size:20px; letter-spacing:-.01em}
  .sub{margin:0 0 24px; color:var(--muted); font-size:14px}
  button{
    font:inherit; border-radius:10px; border:1px solid var(--line);
    padding:11px 18px; cursor:pointer; background:var(--card); color:var(--ink);
  }
  button:hover{border-color:var(--muted)}
  .primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .field{margin:18px 0}
  .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px}
  code,pre{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
    background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
  }
  code{padding:3px 7px; word-break:break-all}
  pre{padding:14px; overflow-x:auto; margin:0; line-height:1.5}
  .hide{display:none}
  .muted{color:var(--muted); font-size:13px}
  .ok{color:var(--ok); font-weight:600}
  .err{color:#d93025; font-size:14px; margin-top:12px}
  @media (prefers-color-scheme:dark){.err{color:#f28b82}}
</style>
</head>
<body>
<main class="card">
  <h1>알뜰폰 혜택 트래커</h1>
  <p class="sub">회선별 혜택 확인과 해지 최적기 판단</p>

  <!-- 로그인 전 -->
  <section id="signedOut" class="hide">
    <button class="primary" id="btnIn">Google로 로그인</button>
    <p class="muted" style="margin-top:14px">
      본인 계정만 접근할 수 있습니다. 다른 계정으로 로그인해도 데이터는 보이지 않습니다.
    </p>
  </section>

  <!-- 로그인 후 -->
  <section id="signedIn" class="hide">
    <div class="row" style="justify-content:space-between">
      <span class="ok">로그인됨</span>
      <button id="btnOut">로그아웃</button>
    </div>

    <div class="field">
      <div class="label">계정</div>
      <code id="email"></code>
    </div>

    <div class="field">
      <div class="label">내 UID</div>
      <div class="row">
        <code id="uid" style="flex:1"></code>
        <button id="btnCopy">복사</button>
      </div>
    </div>

    <div class="field">
      <div class="label">Firestore 보안 규칙 — 아래를 콘솔에 붙여넣기</div>
      <pre id="rules"></pre>
      <div class="row" style="margin-top:8px">
        <button id="btnCopyRules">규칙 복사</button>
      </div>
      <p class="muted" style="margin-top:10px">
        Firebase 콘솔 → Firestore Database → 규칙 탭에 붙여넣고 게시하면
        이 UID로 로그인한 경우에만 데이터를 읽고 쓸 수 있습니다.
      </p>
    </div>
  </section>

  <div id="err" class="err"></div>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const $ = (id) => document.getElementById(id);
const app  = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const rulesFor = (uid) => `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /lines/{lineId} {
      allow read, write: if request.auth != null
                         && request.auth.uid == '${uid}';
      match /months/{ym} {
        allow read, write: if request.auth != null
                           && request.auth.uid == '${uid}';
      }
    }
  }
}`;

const show = (el, on) => el.classList.toggle("hide", !on);
const fail = (e) => { $("err").textContent = e?.message || String(e); };

onAuthStateChanged(auth, (user) => {
  $("err").textContent = "";
  show($("signedIn"), !!user);
  show($("signedOut"), !user);
  if (!user) return;
  $("email").textContent = user.email || "(이메일 없음)";
  $("uid").textContent   = user.uid;
  $("rules").textContent = rulesFor(user.uid);
});

const copy = async (text, btn, label) => {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = "복사됨";
    setTimeout(() => { btn.textContent = old; }, 1200);
  } catch { fail(new Error(label + " 복사 실패 — 직접 선택해 복사해주세요")); }
};

$("btnIn").onclick  = () => signInWithPopup(auth, provider).catch(fail);
$("btnOut").onclick = () => signOut(auth).catch(fail);
$("btnCopy").onclick      = (e) => copy($("uid").textContent, e.target, "UID");
$("btnCopyRules").onclick = (e) => copy($("rules").textContent, e.target, "규칙");
</script>
</body>
</html>
